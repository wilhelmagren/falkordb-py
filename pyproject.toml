[project]
name = "pyfalkor"
version = "1.1.0"
description = "Python client for interacting with any FalkorDB graph database."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "redis>=6.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.8",
]
test = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
]


[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["I", "F", "E", "W", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
